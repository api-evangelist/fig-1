aid: fig-1
name: Fig 1
description: >-
  Fig.1 (Figure 1 Beauty) is a direct-to-consumer skincare brand created through
  8VC's Build program, co-founded with Harvard-trained dermatologist Dr. Courtney
  Rubin, focused on demystifying and democratizing skincare through transparent,
  efficacy-driven, in-house formulations sold across a small launch line of
  cleansers, treatments, and moisturizers. Its public surface is a Shopify-hosted
  ecommerce storefront at fig-1.co; Fig.1 publishes no first-party developer API,
  OpenAPI, SDKs, or documentation. This API Evangelist profile records the brand's
  identity, storefront policy pages, and domain-security posture. The
  /.well-known/openid-configuration served on the host is Shopify's shared
  Customer-Account platform OIDC, not a Fig.1 API.
